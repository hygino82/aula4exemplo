<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="script.js" defer></script>
    <title>Gestão Financeira</title>
</head>

<body>
    <div class="container">
        <label for="valor-entrada">Valor de entrada</label><br />
        <input type="number" id="valor-entrada" required><br />
        <input type="button" value="Calcular" id="btn-calcular" class="btn btn-primary">
        <input type="button" value="Limpar" id="btn-limpar" class="btn btn-warning"><br />
        <label for="txt-necessidades">Necessidades (50%)</label><br />
        <input type="number" id="txt-necessidades" readonly><br />
        <label for="txt-desejos">Desejos (30%)</label><br />
        <input type="number" id="txt-desejos" readonly><br />
        <label>Investimentos (20%)</label><br />
        <input type="number" id="txt-investimentos" readonly> <br />
    </div>
</body>

</html>
